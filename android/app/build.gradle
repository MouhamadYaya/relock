apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * Sentry — téléversement des source maps et des symboles natifs (NDK).
 *
 * `sentry.gradle` accroche la tâche de bundle des variantes release et
 * envoie la source map Hermes composée à Sentry, avec le MÊME nom de release
 * que celui déduit du binaire à l'exécution (`applicationId@versionName+versionCode`).
 * C'est cette égalité, et elle seule, qui fait qu'une stack de production est
 * lisible.
 *
 * Le garde : tant que `android/sentry.properties` n'est pas rempli (jeton
 * d'organisation, donc gitignoré), on n'applique rien du tout — sinon un
 * clone frais du dépôt ne pourrait plus produire de build release.
 */
def sentryPropertiesFile = file("$rootDir/sentry.properties")
if (sentryPropertiesFile.exists() && !sentryPropertiesFile.text.contains("REMPLACER")) {
    apply from: new File(["node", "--print", "require.resolve('@sentry/react-native/package.json')"].execute(null, rootDir).text.trim(), "../sentry.gradle")
} else {
    logger.warn("warning: [Sentry] android/sentry.properties absent ou non rempli - upload desactive. Les stacks de production ne seront PAS symbolisees.")
}

// ✅ react-native-config MUST be applied AFTER com.android.application plugin
apply from: project(':react-native-config').projectDir.getPath() + "/dotenv.gradle"

// (optional) only if you really need per-variant files
project.ext.envConfigFiles = [
    debug  : ".env",
    release: ".env"
]
/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    // root = file("../../")
    // reactNativeDir = file("../../node_modules/react-native")
    // codegenDir = file("../../node_modules/@react-native/codegen")
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    // nodeExecutableAndArgs = ["node"]
    // bundleCommand = "ram-bundle"
    // bundleConfig = file(../rn-cli.config.js)
    // bundleAssetName = "MyApplication.android.bundle"
    // entryFile = file("../js/MyApplication.android.js")
    // extraPackagerArgs = []

    /* Hermes Commands */
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
    //
    // Added by install-expo-modules
    entryFile = file(["node", "-e", "require('expo/scripts/resolveAppEntry')", rootDir.getAbsoluteFile().getParentFile().getAbsolutePath(), "android", "absolute"].execute(null, rootDir).text.trim())
    cliFile = new File(["node", "--print", "require.resolve('@expo/cli')"].execute(null, rootDir).text.trim())
    bundleCommand = "export:embed"
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

// ✅ make hermesEnabled safe even if gradle.properties doesn't define it
def hermesEnabled = (project.findProperty("hermesEnabled") ?: "true")

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    buildFeatures {
        buildConfig = true
    }

    namespace "com.yaya.relock"
    defaultConfig {
        applicationId "com.yaya.relock"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }

        // Clé de publication. Elle n'est JAMAIS dans le dépôt : ni le keystore,
        // ni les mots de passe. Tout vient de propriétés Gradle définies hors
        // arborescence — `~/.gradle/gradle.properties` sur un poste, variables
        // d'environnement `ORG_GRADLE_PROJECT_*` en CI.
        //
        //   RELOCK_UPLOAD_STORE_FILE=/chemin/absolu/relock-upload.keystore
        //   RELOCK_UPLOAD_STORE_PASSWORD=…
        //   RELOCK_UPLOAD_KEY_ALIAS=relock-upload
        //   RELOCK_UPLOAD_KEY_PASSWORD=…
        //
        // Le bloc n'est déclaré que si ces propriétés existent : sans elles, un
        // `assembleRelease` local doit continuer de fonctionner (voir plus bas).
        if (project.hasProperty('RELOCK_UPLOAD_STORE_FILE')) {
            release {
                storeFile file(RELOCK_UPLOAD_STORE_FILE)
                storePassword RELOCK_UPLOAD_STORE_PASSWORD
                keyAlias RELOCK_UPLOAD_KEY_ALIAS
                keyPassword RELOCK_UPLOAD_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // POURQUOI CE N'EST PAS `signingConfigs.debug`.
            //
            // Le keystore de debug est livré avec CHAQUE installation du SDK
            // Android : même fichier, même mot de passe (`android`), même alias,
            // pour tout le monde sur Terre. Signer une release avec, c'est
            // publier une app dont n'importe qui peut fabriquer une mise à jour
            // que le système accepte comme légitime — Android n'identifie une
            // app que par son `applicationId` PLUS sa signature. Play Console
            // refuse d'ailleurs tout binaire signé ainsi.
            //
            // Sans clé de publication configurée, on retombe volontairement sur
            // la clé de debug pour ne pas casser un build local — mais le binaire
            // produit est alors NON PUBLIABLE, et le message ci-dessous le dit.
            if (project.hasProperty('RELOCK_UPLOAD_STORE_FILE')) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
                logger.warn(
                    "\n[relock] ⚠️  Release signée avec la clé de DEBUG (publique).\n" +
                    "[relock]     Binaire de test uniquement — ne pas distribuer.\n" +
                    "[relock]     Pour publier : définir RELOCK_UPLOAD_STORE_FILE,\n" +
                    "[relock]     RELOCK_UPLOAD_STORE_PASSWORD, RELOCK_UPLOAD_KEY_ALIAS\n" +
                    "[relock]     et RELOCK_UPLOAD_KEY_PASSWORD dans ~/.gradle/gradle.properties.\n"
                )
            }
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
