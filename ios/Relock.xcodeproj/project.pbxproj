			outputPaths = (
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# Hermes ships to us as a prebuilt xcframework that carries no debug symbols, so\n# App Store Connect answers every upload with \"The archive did not include a dSYM\n# for the hermes.framework\". The matching dSYM is published on Maven next to the\n# framework itself: fetch it once, cache it inside Pods/ (gitignored), and drop it\n# where Xcode harvests dSYMs for the archive.\n#\n# Release device builds only, and never fatal: a failed download must not break an\n# archive, it only brings the warning back.\n[ \"$CONFIGURATION\" = \"Release\" ] || exit 0\n[ \"$PLATFORM_NAME\" = \"iphoneos\" ] || exit 0\n[ -n \"$DWARF_DSYM_FOLDER_PATH\" ] || exit 0\n\nHERMES_VERSION=$(sed -n 's/^  - hermes-engine (\\([^)]*\\)).*/\\1/p' \"$SRCROOT/Podfile.lock\" | head -1)\nif [ -z \"$HERMES_VERSION\" ]; then\n  echo \"warning: could not read the hermes-engine version from Podfile.lock; skipping the Hermes dSYM\"\n  exit 0\nfi\n\nCACHED_DSYM=\"$PODS_ROOT/hermes-engine/destroot/Library/Frameworks/iphoneos/hermes.framework.dSYM\"\nif [ ! -d \"$CACHED_DSYM\" ]; then\n  URL=\"https://repo1.maven.org/maven2/com/facebook/react/react-native-artifacts/$HERMES_VERSION/react-native-artifacts-$HERMES_VERSION-hermes-framework-dSYM-release.tar.gz\"\n  TMP=$(mktemp -d)\n  if curl -fsSL \"$URL\" -o \"$TMP/hermes-dSYM.tar.gz\" && tar xzf \"$TMP/hermes-dSYM.tar.gz\" -C \"$TMP\" ./iphoneos; then\n    mkdir -p \"$(dirname \"$CACHED_DSYM\")\"\n    rm -rf \"$CACHED_DSYM\"\n    mv \"$TMP/iphoneos/hermes.framework.dSYM\" \"$CACHED_DSYM\"\n  else\n    echo \"warning: could not fetch the Hermes dSYM from $URL; the archive will be uploaded without Hermes symbols\"\n  fi\n  rm -rf \"$TMP\"\nfi\n\nif [ -d \"$CACHED_DSYM\" ]; then\n  mkdir -p \"$DWARF_DSYM_FOLDER_PATH\"\n  cp -Rp \"$CACHED_DSYM\" \"$DWARF_DSYM_FOLDER_PATH/\"\nfi\nexit 0\n";
		};
