<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    Icône alternative « Orbe » — source de vérité.

    Une lune de verre PLEINE, dans le violet de Relock, sur une nuit violette
    très sombre. Aucun terminateur, aucun croissant : c'est ce qui la sépare
    de l'icône d'origine, dont elle reprend en revanche exactement les
    couleurs — celles de l'app (`relock-material.ts` : accentViolet #A78BFA,
    moonHaloSolid #9279F4, accentVioletDeep #7357DC, accentBlue #7C89F8).

    Une version précédente posait une lune claire sur un fond mauve pâle.
    C'était joli et hors sujet : Relock est une app nocturne, et une icône
    rose sur l'écran d'accueil n'appartenait plus à la même application.

    Rendu par scripts/generate-alt-icons.cjs vers :
      ios/Relock/Images.xcassets/AppIcon-Orb.appiconset/*.png
      assets/logo-orb{,@2x,@3x}.png  (l'aperçu du sélecteur)
  -->
  <defs>
    <!--
      La nuit. Violette, jamais noire : le noir pur ferait un trou sur
      l'écran d'accueil, et c'est déjà la règle du fond de l'Accueil.
    -->
    <radialGradient id="night" cx="0.5" cy="0.44" r="0.78">
      <stop offset="0" stop-color="#1A1440"/>
      <stop offset="0.55" stop-color="#100C28"/>
      <stop offset="1" stop-color="#07050F"/>
    </radialGradient>

    <!-- Le halo de la lune, repris de `moonHalo` : le violet de la marque. -->
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.5" stop-color="#9279F4" stop-opacity="0.42"/>
      <stop offset="0.72" stop-color="#9279F4" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#9279F4" stop-opacity="0"/>
    </radialGradient>

    <!--
      Le corps. Lumière en haut à gauche, profondeur vers le bas droit — mais
      le bord ne tombe JAMAIS dans le noir : une lune pleine reste pleine,
      sinon le croissant revient par la bande.
    -->
    <radialGradient id="glass" cx="0.34" cy="0.28" r="0.94">
      <stop offset="0" stop-color="#D6D3FF"/>
      <stop offset="0.26" stop-color="#A9A7FA"/>
      <stop offset="0.52" stop-color="#9279F4"/>
      <stop offset="0.78" stop-color="#7357DC"/>
      <stop offset="1" stop-color="#4E3AA8"/>
    </radialGradient>

    <!-- Lumière traversante, ramassée sur le bord bas-droit. Bleu de marque. -->
    <radialGradient id="through" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C89F8" stop-opacity="0.42"/>
      <stop offset="0.5" stop-color="#7C89F8" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#7C89F8" stop-opacity="0"/>
    </radialGradient>

    <!-- Les deux reflets spéculaires. -->
    <radialGradient id="spec" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#EFEDFF" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#EFEDFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="specSmall" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- La paroi de verre : allumée en bas-droite, éteinte en haut-gauche. -->
    <linearGradient id="shell" x1="0.15" y1="0.1" x2="0.85" y2="0.92">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="0.42" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="0.78" stop-color="#C9C6FF" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.62"/>
    </linearGradient>

    <!--
      Les mers lunaires. Des nappes larges et très douces, pas des cratères :
      un creux cerné d'une lèvre claire redevient une petite sphère dès qu'on
      réduit l'image, et l'icône se couvrait de bulles à 40 px. Ici le
      contraste est si faible qu'il ne survit pas à la réduction — c'est
      voulu : de près une lune, de loin un disque net.
    -->
    <radialGradient id="mare" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4A3B8F" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#4A3B8F" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#3A2E7A" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="sphere">
      <circle cx="512" cy="512" r="360"/>
    </clipPath>
  </defs>

  <rect width="1024" height="1024" fill="url(#night)"/>

  <circle cx="512" cy="512" r="470" fill="url(#halo)"/>
  <circle cx="512" cy="512" r="360" fill="url(#glass)"/>

  <g clip-path="url(#sphere)">
    <!-- Les mers, sous les reflets : le verre les recouvre, il ne les porte pas. -->
    <g>
      <ellipse cx="452" cy="596" rx="168" ry="128"
               transform="rotate(-24 452 596)" fill="url(#mare)"/>
      <ellipse cx="666" cy="452" rx="112" ry="86"
               transform="rotate(-34 666 452)" fill="url(#mare)"/>
      <ellipse cx="576" cy="712" rx="86" ry="62"
               transform="rotate(-14 576 712)" fill="url(#mare)"/>
    </g>

    <ellipse cx="706" cy="778" rx="232" ry="126"
             transform="rotate(-40 706 778)" fill="url(#through)"/>

    <ellipse cx="404" cy="360" rx="150" ry="106"
             transform="rotate(-30 404 360)" fill="url(#spec)"/>
    <ellipse cx="372" cy="322" rx="52" ry="36"
             transform="rotate(-30 372 322)" fill="url(#specSmall)"/>
  </g>

  <circle cx="512" cy="512" r="353" fill="none" stroke="url(#shell)" stroke-width="13"/>
</svg>
