name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# Cancel in-flight runs for the same PR / branch so stale runs don't queue up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Biome
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

  test:
    name: Tests & guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test -- --coverage --coverageReporters=text-summary

      - name: Check icons registry
        run: npm run check:icons

      - name: Check import paths
        run: npm run check:imports

      # Le site public getrelock.com est du HTML statique, mais ses métadonnées
      # (canonical, hreflang, JSON-LD, sitemap, llms.txt) et ses images sont
      # générées. Un commit qui touche une page sans régénérer laisserait un
      # sitemap ou un JSON-LD qui décrit une version disparue.
      - name: Check legal site SEO artefacts
        run: npm run legal:check

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # CONSULTATIF, PAS BLOQUANT — et ce n'est pas un renoncement.
    #
    # `react-native` dépend de `@react-native/community-cli-plugin`, donc de
    # tout le CLI React Native. Ce dernier atterrit ainsi dans le scope
    # RUNTIME du graphe npm, alors que rien de cet outillage n'atteint jamais
    # un appareil : Metro n'embarque que le JS réellement atteint depuis
    # `index.js`. Le graphe ne peut pas le savoir, et signale donc du
    # build-time comme s'il était embarqué.
    #
    # Conséquence : le job échoue sur des vulnérabilités que le dépôt porte
    # déjà, identiques entre la base et la tête — aucune PR ne peut les
    # corriger. Les résoudre demande de monter Expo SDK, sharp et apisauce en
    # MAJEUR, ce qui touche le cœur du build iOS et ses cinq extensions
    # natives : un chantier à part, sur sa propre branche, avec un build
    # device de bout en bout.
    #
    # Le rapport reste produit à chaque PR (logs + onglet Security), et
    # Dependabot ouvre les correctifs de sécurité. Ce qui disparaît, c'est
    # seulement le blocage d'une PR sur un état qu'elle n'a pas créé.
    #
    # À REMETTRE BLOQUANT une fois l'arbre assaini.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
