name: Android CI Build

# Manual build or tag-triggered release build.
# PR quality checks (lint, tests, type-check) live in ci.yml.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle*') }}
          restore-keys: gradle-

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Seed .env for build
        run: cp .env.example .env

      # Sentry : écrit les identifiants sentry-cli AVANT le build.
      #
      # L'upload lui-même n'a PAS lieu ici : il est fait pendant le build, par
      # la phase Xcode « Upload Debug Symbols to Sentry » et par sentry.gradle.
      # C'est indispensable — eux seuls connaissent le nom de release déduit du
      # binaire (`com.yaya.relock@<versionName>+<versionCode>`), qui doit être
      # IDENTIQUE à celui que le SDK enverra à l'exécution. Un upload
      # a posteriori sous le nom du tag git ne correspondrait à rien et les
      # stacks resteraient illisibles.
      #
      # Secrets à créer : SENTRY_ORG, SENTRY_PROJECT, SENTRY_AUTH_TOKEN
      # (scopes project:releases + org:read).
      - name: Configure Sentry (source maps + symboles)
        env:
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "::warning::SENTRY_AUTH_TOKEN absent - upload desactive. Les stacks de ce build ne seront pas symbolisees."
            exit 0
          fi
          for dir in ios android; do
            printf 'defaults.org=%s\ndefaults.project=%s\nauth.token=%s\n' \
              "$SENTRY_ORG" "$SENTRY_PROJECT" "$SENTRY_AUTH_TOKEN" > "$dir/sentry.properties"
          done
          echo "Sentry configure pour ios/ et android/."

      # Template uses the debug keystore. Replace with a real signing step
      # (e.g. decode a base64-encoded keystore from secrets) before store upload.
      - name: Build Android Release APK
        run: cd android && ./gradlew assembleRelease

      # Uncomment for Play Store upload (requires signing + Google service account secret):
      # - name: Build Android Release Bundle (AAB)
      #   run: cd android && ./gradlew bundleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: android/app/build/outputs/apk/release/*.apk
